services:
  api:
    build: .
    container_name: fastapi-service
    env_file: .env
    environment:
      PYTHONPATH: /app/src
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src:rw
    command: uvicorn app.main:app --reload --host 0.0.0.0 --port 8000 --app-dir src
    depends_on:
      - redis
      - postgres
    platform: linux/amd64

  worker:
    build: .
    container_name: scrape-worker
    env_file: .env
    environment:
      PYTHONPATH: /app/src
    command: python -m app.worker.runner
    depends_on:
      - redis
      - postgres
    platform: linux/amd64

  redis:
    image: redis:7.2-alpine
    container_name: jobhub-redis
    ports:
      - "6379:6379"
    platform: linux/amd64

  postgres:
    image: postgres:16-alpine
    container_name: jobhub-postgres
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5434:5432" # host:container – use 5433 on host to avoid conflicts
    volumes:
      - postgres_data:/var/lib/postgresql/data
    platform: linux/amd64

  frontend:
    build:
      context: ../jobhub-Frontend # folder containing package.json + Dockerfile
    container_name: jobhub-frontend
    ports:
      - "3000:80" # open the frontend at http://localhost:3000
    depends_on:
      - api

  frontend-dev:
    image: node:20-alpine
    container_name: jobhub-frontend-dev
    working_dir: /app
    volumes:
      - ../../jobhub-frontend/jobhub-frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"
    depends_on:
      - api

volumes:
  postgres_data:
  frontend_node_modules:
