[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jobhub-api"
version = "0.1.0"
description = "Job Hub API – backend for scrape requests, job postings, applications"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "httpx>=0.27.0",
  "loguru>=0.7.0",
]
[project.optional-dependencies]
dev = ["pytest>=8.2","pytest-asyncio>=0.23","anyio>=4.4","ruff>=0.6.0","mypy>=1.10","pre-commit>=3.7","types-requests"]
[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"
asyncio_mode = "auto"
